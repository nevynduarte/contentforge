[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contentforge"
version = "0.1.0"
description = "Turn raw podcast/interview footage into polished, captioned, branded social clips."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "Bridges AI", email = "contact@bridgesai.consulting" }]
keywords = ["video", "podcast", "ffmpeg", "whisper", "captions", "shorts", "reels", "tiktok"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "tqdm>=4.66",
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  "pysubs2>=1.7",
  "pyloudnorm>=0.1",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]                # GPU inference for faster-whisper on Windows/Linux
tracking = ["mediapipe>=0.10", "opencv-python-headless>=4.9", "insightface>=0.7", "onnxruntime>=1.18", "norfair>=2.2"]
shots = ["opencv-python-headless>=4.9", "insightface>=0.7", "onnxruntime>=1.18", "spandrel>=0.4", "torch>=2.4"]  # five-shot renderer + Real-ESRGAN
voice = ["kokoro>=0.9", "soundfile>=0.12", "misaki[en]>=0.9", "spacy>=3.7"]  # Kokoro TTS for bumpers
audio = ["pedalboard>=0.9", "auto-editor>=27"]                    # dynamics / ducking, dead-air cuts
diarize = ["pyannote.audio>=3.1", "torch>=2.2"]                   # speaker diarization (needs HF token)
nlp = ["keybert>=0.8", "anthropic>=0.40"]                         # topic extraction + LLM scoring/copy
scenes = ["scenedetect[opencv]>=0.6"]                             # shot boundary detection
separation = ["demucs>=4.0"]                                      # voice/music source separation
all = ["contentforge[cuda,tracking,shots,voice,audio,diarize,nlp,scenes,separation]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
contentforge = "contentforge.cli:app"
cf = "contentforge.cli:app"

[project.urls]
Homepage = "https://github.com/nevynduarte/contentforge"

[tool.hatch.build.targets.wheel]
packages = ["contentforge"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM", "PIE"]
ignore = ["B008", "E501", "RUF012", "RUF046", "RUF059", "SIM108", "SIM115", "E701", "E702"]   # B008: typer.Option/Argument defaults are the Typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
