# Bridges AI Consulting brand template.
# Source of truth: the "Bridges AI Design System" tokens (bridges-site src/index.css):
#   paper off-white background, deep navy ink, muted bronze accent; Inter for UI/body,
#   Source Serif 4 for display headlines (weight 500, tracking -0.01em), eyebrows in Inter
#   600 uppercase with 0.2em tracking in bronze. Corners nearly square (2-4 px), no pills.
name: bridges_ai
company: Bridges AI Consulting
show: 3rd i Podcast
colors:
  primary: "#182639"      # --primary  hsl(215 42% 16%)  navy
  ink: "#121C2B"          # --ink      hsl(215 42% 12%)  darker navy for dark bands / banner
  accent: "#946338"       # --accent   hsl(28 45% 40%)   bronze
  accent_light: "#D9A063" # bronze lifted for text on dark video (same hue, readable)
  highlight: "#F2C877"    # active caption word: warm gold in the bronze family, high contrast on ink
  background: "#0E1520"   # letterbox ground (ink, slightly darker)
  paper: "#FCFAF8"        # --background hsl(40 33% 98%)
  text: "#FCFAF8"         # --ink-foreground on dark surfaces
  foreground: "#192230"   # --foreground on paper
  muted: "#5A6472"        # --muted-foreground
  danger: "#B91C1C"       # --destructive
hashtags:
  - "#BridgesAI"
  - "#3rdiPodcast"
  - "#AIinSafetyTech"
  - "#SafetyTech"
  - "#ArtificialIntelligence"
fonts:
  sans: Inter-Bold.ttf
  sans_semibold: Inter-SemiBold.ttf
  sans_medium: Inter-Medium.ttf
  display: SourceSerif4-Semibold.ttf
captions:
  font: Inter-Bold.ttf
  size: 52
  color: "#FCFAF8"
  highlight: "#F2C877"
  stroke: "#0E1520"
  stroke_width: 2
  pill_color: "#121C2B"
  pill_alpha: 200
  pill_radius: 4
  pill_pad: 16
  max_words: 5
  max_chars: 35
  hold: 0.4
  y: 780
assets:
  logo: lockup_white.png        # horizontal lockup on dark/video surfaces
  logo_dark: lockup_black.png   # lockup for paper surfaces
  icon: icon_white.png          # bridge glyph
  lower_third: lower_third.png
  intro: intro.mp4
  outro: outro.mp4
speakers:
  host:
    name: "Host"
    title: "3rd i Podcast"
  guest:
    name: "Guest"
    title: "Bridges AI Consulting"
