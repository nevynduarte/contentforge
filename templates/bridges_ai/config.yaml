# Bridges AI brand template.
# Palette rationale ("trustworthy tech at the safety/AI intersection"):
#   deep navy = authority/trust, signal teal = AI/clarity, safety amber = attention
#   (matches the karaoke yellow already used in the clips), near-black letterbox, cool grey secondary text.
name: bridges_ai
company: Bridges AI
show: 3rd i Podcast
colors:
  primary: "#0B1F3A"      # deep navy: lower thirds, title cards
  accent: "#00C2A8"       # signal teal: bars, progress, emphasis
  highlight: "#FFDC32"    # safety amber: active caption word
  background: "#111111"   # letterbox background
  text: "#FFFFFF"
  muted: "#9AA7B8"
  danger: "#FF5A5F"       # sparingly, for warning-style callouts
hashtags:
  - "#BridgesAI"
  - "#3rdiPodcast"
  - "#AIinSafetyTech"
  - "#SafetyTech"
  - "#ArtificialIntelligence"
captions:
  font: arialbd.ttf
  size: 52
  color: "#FFFFFF"
  highlight: "#FFDC32"
  stroke: "#000000"
  stroke_width: 2
  pill_color: "#000000"
  pill_alpha: 180
  pill_radius: 12
  pill_pad: 16
  max_words: 5
  max_chars: 35
  hold: 0.4
  y: 780
assets:
  logo: logo.png            # placeholder generated by scripts/make_brand_assets.py; replace with the real mark
  lower_third: lower_third.png
  intro: intro.mp4          # optional bumpers (not generated yet)
  outro: outro.mp4
speakers:
  host:
    name: "Host"
    title: "3rd i Podcast"
  guest:
    name: "Guest"
    title: "Bridges AI"
